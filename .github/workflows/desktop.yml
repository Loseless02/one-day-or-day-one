# Builds the desktop app on real Windows, macOS and Linux machines.
# - Push a tag like v1.0.1: builds all three and publishes a GitHub Release with the installers.
# - "Run workflow" from the Actions tab: builds only, installers appear as run artifacts.
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            files: |
              dist/*.exe
          - os: macos-latest
            args: --mac --arm64 --x64
            files: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            args: --linux AppImage deb tar.gz
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No code-signing certificates: builds are unsigned (see README for first-launch steps).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: one-day-or-day-one-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la installers
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --title "One Day or Day One $TAG" --notes-file - <<'EOF'
          ## Download

          | System | File |
          |---|---|
          | **Windows** | `One-Day-or-Day-One-Setup-*.exe` (installer) or `*-portable.exe` (no install) |
          | **macOS, Apple Silicon (M1 and newer)** | `*-arm64.dmg` |
          | **macOS, Intel** | `*-x64.dmg` |
          | **Linux** | `*.AppImage` (any distro), `*.deb` (Debian/Ubuntu) or `*.tar.gz` |

          **iPhone / any browser:** https://loseless02.github.io/one-day-or-day-one/ (in Safari: Share → Add to Home Screen)

          ### First launch
          These builds are not code-signed, so your system will warn once:
          - **Windows:** "Windows protected your PC" → **More info** → **Run anyway**.
          - **macOS:** right-click the app → **Open** → **Open**. If macOS says the app is damaged, run `xattr -cr "/Applications/One Day or Day One.app"` in Terminal.
          - **Linux:** `chmod +x One-Day-or-Day-One-*.AppImage`, then run it.
          EOF
          fi
